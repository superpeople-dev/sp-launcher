name: Release

# Every push to main that changes the launcher publishes a signed release, the
# same build tools/publish-update.ps1 makes by hand: the game binaries of the
# latest superpeople-dev/sp-native build (both DLLs, the client fixes pak and
# its .sig) and 7zr.exe bundled, the installer signed, latest.json written. The GitHub release holds
# the installer, its .sig and latest.json; launchers from 0.3.4 on read
# latest.json there first (tauri.conf.json, plugins.updater.endpoints).
#
# Version: the one in src-tauri/tauri.conf.json when it is newer than the last
# release, otherwise the last release with its patch number + 1. A commit whose
# message contains [skip release] is not released. Run this workflow by hand
# (Actions -> Release -> Run workflow) to ship a new sp-native build without a
# launcher change: that releases even a commit that is released already.
#
# The signing key and SP_NATIVE_TOKEN (read access to sp-native) are secrets of
# the "release" environment, which only main can use (UPDATING.md, "Automatic
# releases").
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/unsigned-build.yml'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: windows-2022
    environment: release
    steps:
      - name: Check the release secrets
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          NATIVE_TOKEN: ${{ secrets.SP_NATIVE_TOKEN }}
        run: |
          $missing = @()
          if (-not $env:SIGNING_KEY) { $missing += 'TAURI_SIGNING_PRIVATE_KEY' }
          if (-not $env:NATIVE_TOKEN) { $missing += 'SP_NATIVE_TOKEN' }
          if ($missing) {
            Write-Host "::error::The release environment is missing: $($missing -join ', '). See UPDATING.md, Automatic releases."
            exit 1
          }

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags (version) and the history (release notes)

      - name: Pick the version
        id: version
        shell: pwsh
        run: |
          if ((git tag --points-at HEAD --list 'v*') -and $env:GITHUB_EVENT_NAME -ne 'workflow_dispatch') {
            Write-Host "::notice::This commit is already released."
            "skip=true" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $inRepo = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $last = git tag --list 'v*' |
            ForEach-Object { $_.Substring(1) } |
            Where-Object { $_ -match '^\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_ } |
            Select-Object -Last 1
          if (-not $last -or [version]$inRepo -gt [version]$last) {
            $version = $inRepo
          } else {
            $v = [version]$last
            $version = "$($v.Major).$($v.Minor).$($v.Build + 1)"
          }
          Write-Host "Releasing $version (last release: $last, repository: $inRepo)"
          "version=$version" >> $env:GITHUB_OUTPUT
          "previous=$last" >> $env:GITHUB_OUTPUT

      # Bun installs the packages and runs the scripts (its version: package.json,
      # packageManager); Node still runs the tools/*.mjs scripts and the CLIs'
      # own launchers (vite, tsc, tauri).
      - uses: actions/setup-node@v7
        if: steps.version.outputs.skip != 'true'
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        if: steps.version.outputs.skip != 'true'
        with:
          bun-version-file: package.json

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.skip != 'true'
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.skip != 'true'
        with:
          workspaces: |
            src-tauri
            tools/client-fixes-tests

      - name: Install frontend dependencies
        if: steps.version.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Set the version
        if: steps.version.outputs.skip != 'true'
        run: node tools/set-version.mjs ${{ steps.version.outputs.version }}

      # XAPOFX1_5.dll, SPClientFixes.dll and the client fixes pak/.sig, built,
      # tested and signed by sp-native; each checked against its manifest.json.
      - name: Get the game binaries from sp-native
        id: native
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.SP_NATIVE_TOKEN }}
        run: |
          ./tools/fetch-binaries.ps1
          $native = Get-Content src-tauri/resources/sp-native.json -Raw | ConvertFrom-Json
          "build=$($native.build)" >> $env:GITHUB_OUTPUT

      - name: Check client fixes deployment lifecycle
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          cargo test --manifest-path tools/client-fixes-tests/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 7-Zip's standalone extractor for the Download tab's backup (download.rs),
      # from 7-Zip's own GitHub release, checked against the digest GitHub lists.
      - name: Bundle 7zr.exe
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        env:
          SEVENZR_URL: https://github.com/ip7z/7zip/releases/download/26.03/7zr.exe
          SEVENZR_SHA256: ad4c82fadcbdf93c03b4fc440f300509c7d60c5c2f4d183e35d9d70d6957037d
        run: |
          $exe = Join-Path $env:RUNNER_TEMP '7zr.exe'
          Invoke-WebRequest $env:SEVENZR_URL -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:SEVENZR_SHA256) { throw "7zr.exe does not match its checksum: $hash" }
          Copy-Item -LiteralPath $exe -Destination src-tauri/resources/7zr.exe

      - name: Build and sign the installer
        if: steps.version.outputs.skip != 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The current key has none; set anyway so Tauri never asks for one.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build

      - name: Prepare the release files
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          NATIVE: ${{ steps.native.outputs.build }}
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter "*_${env:VERSION}_x64-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "no installer for $env:VERSION" }
          if (-not (Test-Path "$($setup.FullName).sig")) {
            throw 'The installer was built but not signed, so no launcher would accept it. Check TAURI_SIGNING_PRIVATE_KEY.'
          }
          # The name GitHub gives it (no space), so its address is known.
          $name = "SP.Launcher_${env:VERSION}_x64-setup.exe"
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item -LiteralPath $setup.FullName -Destination "release/$name"
          Copy-Item -LiteralPath "$($setup.FullName).sig" -Destination "release/$name.sig"

          $range = if ($env:PREVIOUS) { "v$env:PREVIOUS..HEAD" } else { 'HEAD' }
          $notes = (git log $range --no-merges --pretty=format:%s | Select-Object -First 20 | ForEach-Object { "- $_" }) -join "`n"
          if (-not $notes) { $notes = "Version $env:VERSION" }
          $notes += "`n- Game binaries: sp-native $env:NATIVE"

          node tools/make-update-manifest.mjs `
            --version $env:VERSION `
            --sig "release/$name.sig" `
            --url "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$env:VERSION/$name" `
            --notes $notes `
            --out release/latest.json
          if ($LASTEXITCODE -ne 0) { throw 'manifest generation failed' }

      - name: Publish the release
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$env:VERSION" (Get-ChildItem release).FullName `
            --target $env:GITHUB_SHA `
            --title "sp-launcher v$env:VERSION" `
            --generate-notes `
            --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Released [v$env:VERSION](https://github.com/$env:GITHUB_REPOSITORY/releases/tag/v$env:VERSION)" >> $env:GITHUB_STEP_SUMMARY

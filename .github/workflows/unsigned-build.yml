name: Unsigned Windows build

# Every push to main and every pull request builds and tests the launcher, so a
# ready unsigned build is always there (Actions -> run -> Artifacts). Signed
# releases are release.yml's.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: unsigned-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v7

      # Bun installs the packages and runs the scripts (its version: package.json,
      # packageManager); Node still runs the tools/*.mjs scripts and the CLIs'
      # own launchers (vite, tsc, tauri).
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Both Cargo projects: the lifecycle tests are a separate workspace with
      # their own target folder, and recompiled from scratch without this.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            tools/client-fixes-tests

      # The game binaries of the latest sp-native build (built, tested and
      # signed there). A pull request from a fork gets no secrets: it builds
      # without them, as a fresh clone does (build.rs warns).
      - name: Get the game binaries from sp-native
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.SP_NATIVE_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) {
            Write-Host '::warning::No SP_NATIVE_TOKEN here: building without the game binaries.'
            exit 0
          }
          ./tools/fetch-binaries.ps1

      - name: Check client fixes deployment lifecycle
        shell: pwsh
        run: |
          cargo test --manifest-path tools/client-fixes-tests/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri executable without bundling
        run: bun run tauri build --no-bundle

      - name: Stage unsigned binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/unsigned -Force | Out-Null
          Copy-Item -LiteralPath src-tauri/target/release/sp-launcher.exe -Destination artifacts/unsigned/

      - uses: actions/upload-artifact@v7
        with:
          name: sp-launcher-unsigned-windows-x64
          path: artifacts/unsigned/
          if-no-files-found: error

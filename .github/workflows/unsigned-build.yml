name: Unsigned Windows build

# Every push to main and every pull request builds and tests the launcher, so a
# ready unsigned build is always there (Actions -> run -> Artifacts). Signed
# releases are release.yml's.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: unsigned-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      # Bun installs the packages and runs the scripts (its version: package.json,
      # packageManager); Node still runs the tools/*.mjs scripts and the CLIs'
      # own launchers (vite, tsc, tauri).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Both Cargo projects: the lifecycle tests are a separate workspace with
      # their own target folder, and recompiled from scratch without this.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            tools/client-fixes-tests

      - name: Verify bundled ClientFixes resources
        run: node tools/verify-clientfixes-resources.mjs

      - name: Build client fixes DLL
        shell: pwsh
        run: |
          cmake -S client-fixes -B client-fixes/build -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build client-fixes/build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir client-fixes/build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath client-fixes/build/Release/SPClientFixes.dll -Destination src-tauri/resources/SPClientFixes.dll

      - name: Check client fixes deployment lifecycle
        shell: pwsh
        run: |
          cargo test --manifest-path tools/client-fixes-tests/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri executable without bundling
        run: bun run tauri build --no-bundle

      - name: Stage unsigned binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/unsigned -Force | Out-Null
          Copy-Item -LiteralPath src-tauri/target/release/sp-launcher.exe -Destination artifacts/unsigned/
          Copy-Item -LiteralPath client-fixes/build/Release/SPClientFixes.dll -Destination artifacts/unsigned/

      - uses: actions/upload-artifact@v4
        with:
          name: sp-launcher-unsigned-windows-x64
          path: artifacts/unsigned/
          if-no-files-found: error

[package]
name = "sp-launcher"
version = "0.3.3"
description = "SUPER PEOPLE Launcher"
edition = "2021"

# Only the rlib that main.rs links. The Tauri template also lists "staticlib"
# and "cdylib", which only mobile builds use: on Windows they made every build
# write an unused DLL and a 1 GB .lib (dev) and optimize the whole program two
# extra times (release).
[lib]
name = "sp_launcher_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util"] }

# Download tab (download.rs): streaming body, MD5 check
futures-util = { version = "0.3", default-features = false }
md-5 = "0.10"
sha2 = "0.10.9"

# loopback session gateway
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

thiserror = "2"
discord-rich-presence = "1.1.0"

# DPAPI, for storing the launcher key encrypted at rest. Windows-only on
# purpose: the launcher ships for Windows, and a non-Windows build falls back
# to a passthrough that auth.rs marks loudly as not being encryption.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Power", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }

# Thin LTO with parallel codegen: a clean release build takes ~1m20s instead of
# ~3m15s (28-core PC), for a .exe ~140 KB bigger once compressed. Fat LTO with
# codegen-units = 1 ran the final optimization on a single core.
[profile.release]
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
